# Tailnet addresses only (Headscale hands out 100.64.0.0/10 and fd7a:115c:a1e0::/48).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mesh-only
spec:
  ipAllowList:
    sourceRange: [100.64.0.0/10, "fd7a:115c:a1e0::/48"]
---
# Sign-in and the group infra-admins, decided by Oathkeeper (cglc-main/auth, ory/oathkeeper/rules.yml).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forward-auth
spec:
  forwardAuth:
    address: http://oathkeeper.auth.svc.cluster.local:4456/decisions
    trustForwardHeader: true
    authResponseHeaders: [Remote-User, Remote-Email, Remote-Name]
    maxResponseBodySize: 65536
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headers
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
    stsSeconds: 31536000
    stsIncludeSubdomains: true
