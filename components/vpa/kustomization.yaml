# Namespace labels for Goldilocks: it creates a VPA for every workload in the namespace, which sets requests from real
# usage and never touches limits.
#
# Mode Recreate: the updater recreates a pod whose request has drifted from the recommendation (vpa.yaml has when),
# and the new pod gets the current one. Not InPlaceOrRecreate: kubelet refuses in-place resize for containers with swap
# (Infeasible), and the pod kept a raised request in its spec that it was never given. Not Initial: requests were set
# only at pod creation and went stale, and the scheduler counted the stale ones.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: { kind: Namespace }
    patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: any
        labels:
          goldilocks.fairwinds.com/enabled: "true"
        annotations:
          goldilocks.fairwinds.com/vpa-update-mode: Recreate
          goldilocks.fairwinds.com/vpa-resource-policy: '{"containerPolicies":[{"containerName":"*","controlledValues":"RequestsOnly"}]}'
