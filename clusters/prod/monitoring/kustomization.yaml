# Metrics, logs, alerts and Grafana: one chart, victoria-metrics-k8s-stack. tier-3, the first to go when memory runs
# short, except vmsingle and vlsingle (tier-2: their volumes pin them to a node); a dead man's switch (healthchecks.io)
# reports when it is gone.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - release
  - namespace
  - goldilocks
  - dashboards
