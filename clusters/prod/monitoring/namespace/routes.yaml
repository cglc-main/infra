# Grafana has its own sign-in (the SSO); the VictoriaLogs UI has none, so it gets mesh-only + forward-auth.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs: [{ name: main, namespace: traefik, sectionName: int }]
  hostnames: [grafana.int.bulbashenko.com]
  rules:
    - filters:
        - { type: ExtensionRef, extensionRef: { group: traefik.io, kind: Middleware, name: mesh-only } }
        - { type: ExtensionRef, extensionRef: { group: traefik.io, kind: Middleware, name: headers } }
      backendRefs: [{ name: vm-grafana, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: logs
spec:
  parentRefs: [{ name: main, namespace: traefik, sectionName: int }]
  hostnames: [logs.int.bulbashenko.com]
  rules:
    - filters:
        - { type: ExtensionRef, extensionRef: { group: traefik.io, kind: Middleware, name: mesh-only } }
        - { type: ExtensionRef, extensionRef: { group: traefik.io, kind: Middleware, name: forward-auth } }
        - { type: ExtensionRef, extensionRef: { group: traefik.io, kind: Middleware, name: headers } }
      backendRefs: [{ name: vlsingle-vm, port: 9428 }]
