# Traefik on every node, on the host network: it receives the Floating IP's traffic directly (keepalived moves the IP
# to a node whose Traefik answers /ping) and sees each client's real address. Binding ports below 1024 without root
# works because the hosts set net.ipv4.ip_unprivileged_port_start=0 (hosts/cloud-init.yaml).
#   80, 443                  HTTP(S): the Gateway traefik/main (configs/gateway.yaml)
#   25, 465, 587, 993        mail: IngressRouteTCP to Stalwart with PROXY protocol (apps/stalwart)
#   9000 (/ping), 9101       health and metrics, closed by the Hetzner firewall
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 1h
  targetNamespace: traefik
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      version: 43.0.0
      sourceRef: { kind: HelmRepository, name: traefik }
  install: { remediation: { retries: 3 } }
  upgrade: { remediation: { retries: 3 } }
  values:
    deployment:
      kind: DaemonSet
      # On the host network, but resolving Services (forward-auth calls oathkeeper.auth.svc.cluster.local).
      dnsPolicy: ClusterFirstWithHostNet
    hostNetwork: true
    updateStrategy:
      type: RollingUpdate
      rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
    priorityClassName: system-cluster-critical
    ingressClass: { enabled: false }
    api: { dashboard: false }
    providers:
      kubernetesIngress: { enabled: false }
      kubernetesCRD: { enabled: true }
      kubernetesGateway: { enabled: true }
    gateway: { enabled: false }
    gatewayClass: { enabled: true, name: traefik }
    service:
      spec: { type: ClusterIP }
    log: { format: json }
    accessLog: { enabled: true, format: json }
    ports:
      traefik: { port: 9000 }
      metrics: { port: 9101 }
      web:
        port: 80
        http:
          redirections:
            entryPoint: { to: websecure, scheme: https, permanent: true }
      websecure:
        port: 443
        http3: { enabled: false }
      smtp: { port: 25, protocol: TCP, expose: { default: false } }
      submissions: { port: 465, protocol: TCP, expose: { default: false } }
      submission: { port: 587, protocol: TCP, expose: { default: false } }
      imaps: { port: 993, protocol: TCP, expose: { default: false } }
