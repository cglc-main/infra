# Vertical Pod Autoscaler: keeps memory and CPU requests at what pods actually use (mode Recreate, components/vpa).
# Goldilocks creates its objects (goldilocks.yaml); limits written by the apps are left alone.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
spec:
  interval: 1h
  targetNamespace: vpa
  releaseName: vpa
  chart:
    spec:
      chart: vertical-pod-autoscaler
      version: 0.17.0
      sourceRef: { kind: HelmRepository, name: autoscaler }
  install: { remediation: { retries: 3 } }
  upgrade: { remediation: { retries: 3 } }
  values:
    # The updater recreates a running pod whose request has drifted from the recommendation: at once when it is outside
    # the recommended range, otherwise after 12 h when it is 10 % off. The admission controller gives the new pod the
    # current recommendation. Without it a request was set only when a pod was created and then went stale: the
    # scheduler counted stale requests (~1.5 GiB more than pods used) and a pod pinned to its node stayed Pending.
    #
    # Not in place: kubelet refuses in-place resize for containers with swap (zram). --min-replicas=1: the default 2
    # never evicts single-replica workloads, most of ours. A single-replica pod restarts for that, about a minute.
    # One replica without a PodDisruptionBudget: with minAvailable 1 the budget would block every drain (kured).
    updater:
      replicas: 1
      podDisruptionBudget: { enabled: false }
      extraArgs:
        - --min-replicas=1
    recommender:
      # VPA never recommends less than 250 MB per pod by default: on 4 GB nodes that alone exceeds what the nodes can
      # allocate (Traefik, using ~55 MiB, got 250 MiB). A low floor lets measured usage set the requests.
      #
      # Memory requests follow the typical daily peak (median), not the 90th percentile: pods peak at different times,
      # so the sum of every pod's worst peak (~7.7 GB) was more than the nodes can allocate (~6 GB with k3s's real
      # reserve), while the nodes never used more than ~5 GB for pods at once. A rarer peak is covered by zram and by
      # eviction in priority order (tier-3 first). The safety margin on top is 5 % instead of the default 15 %: with
      # 15 % the requests still did not fit (vmsingle stayed Pending), and zram is the real margin here.
      extraArgs:
        - --pod-recommendation-min-memory-mb=16
        - --target-memory-percentile=0.5
        - --recommendation-margin-fraction=0.05
