# Vertical Pod Autoscaler: sets memory and CPU requests from what pods actually use (in place, without restarts where
# possible). Goldilocks creates its objects (goldilocks.yaml); limits written by the apps are left alone.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
spec:
  interval: 1h
  targetNamespace: vpa
  releaseName: vpa
  chart:
    spec:
      chart: vertical-pod-autoscaler
      version: 0.17.0
      sourceRef: { kind: HelmRepository, name: autoscaler }
  install: { remediation: { retries: 3 } }
  upgrade: { remediation: { retries: 3 } }
