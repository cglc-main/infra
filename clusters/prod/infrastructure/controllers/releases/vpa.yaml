# Vertical Pod Autoscaler: sets memory and CPU requests from what pods actually use (in place, without restarts where
# possible). Goldilocks creates its objects (goldilocks.yaml); limits written by the apps are left alone.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
spec:
  interval: 1h
  targetNamespace: vpa
  releaseName: vpa
  chart:
    spec:
      chart: vertical-pod-autoscaler
      version: 0.17.0
      sourceRef: { kind: HelmRepository, name: autoscaler }
  install: { remediation: { retries: 3 } }
  upgrade: { remediation: { retries: 3 } }
  values:
    recommender:
      # VPA never recommends less than 250 MB per pod by default: on 4 GB nodes that alone exceeds what the nodes can
      # allocate (Traefik, using ~55 MiB, got 250 MiB). A low floor lets measured usage set the requests.
      extraArgs: [--pod-recommendation-min-memory-mb=16]
