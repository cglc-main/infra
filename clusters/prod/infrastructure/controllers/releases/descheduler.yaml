# After a lost node comes back, the two replicas of a tier-1 app may still share one node. The descheduler moves one
# of them back so that the next node failure cannot take both.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
spec:
  interval: 1h
  targetNamespace: kube-system
  releaseName: descheduler
  chart:
    spec:
      chart: descheduler
      version: 0.37.0
      sourceRef: { kind: HelmRepository, name: descheduler }
  install: { remediation: { retries: 3 } }
  upgrade: { remediation: { retries: 3 } }
  values:
    # A CronJob (the chart's default): a pod exists only for the few seconds of a run, instead of a Deployment holding
    # its 256 MiB request (it used 30-80 MiB) all the time on nodes that have ~2 GB each for pods.
    kind: CronJob
    schedule: "*/10 * * * *"
    deschedulerPolicy:
      profiles:
        - name: spread
          pluginConfig:
            - name: DefaultEvictor
              args:
                evictLocalStoragePods: true
                nodeFit: true
            - name: RemovePodsViolatingTopologySpreadConstraint
              args:
                constraints: [DoNotSchedule, ScheduleAnyway]
            - name: RemoveDuplicates
          plugins:
            balance:
              enabled: [RemovePodsViolatingTopologySpreadConstraint, RemoveDuplicates]
