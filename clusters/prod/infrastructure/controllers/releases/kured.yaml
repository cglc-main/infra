# kured reboots a node after unattended-upgrades installed a kernel or libc update (/var/run/reboot-required), one node
# at a time, drained first, at night.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
spec:
  interval: 1h
  targetNamespace: kube-system
  releaseName: kured
  chart:
    spec:
      chart: kured
      version: 6.1.0
      sourceRef: { kind: HelmRepository, name: kubereboot }
  install: { remediation: { retries: 3 } }
  upgrade: { remediation: { retries: 3 } }
  values:
    configuration:
      period: 1h
      startTime: "02:00"
      endTime: "05:00"
      timeZone: Europe/Berlin
      drainTimeout: 15m
      lockTtl: 30m
