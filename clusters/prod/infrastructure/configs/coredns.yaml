# The cluster DNS that k3s ships runs one replica: the node it is on would take DNS down with it. Its manifest leaves
# the replica count open and already spreads replicas over nodes, so these two objects make it highly available
# while k3s keeps managing and upgrading it.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coredns
  namespace: kube-system
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: coredns }
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 80 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coredns
  namespace: kube-system
spec:
  minAvailable: 1
  selector: { matchLabels: { k8s-app: kube-dns } }
