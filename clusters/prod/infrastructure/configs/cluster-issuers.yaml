# letsencrypt: public certificates, DNS-01 at Cloudflare (token in cluster-issuers.sops.yaml).
# internal-ca: the CA of internal TLS (the Postgres server certificate). Its certificate is public and committed
# (components/internal-ca/ca.crt); its key is in cluster-issuers.sops.yaml.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: postmaster@bulbashenko.com
    privateKeySecretRef: { name: letsencrypt-account }
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef: { name: cloudflare-api-token, key: api-token }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: internal-ca
