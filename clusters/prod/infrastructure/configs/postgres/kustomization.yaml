# The cluster's Postgres: CloudNativePG cluster `pg` in the namespace `data`. One database and role per service.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data
resources:
  - namespace.yaml
  - cluster.yaml
  - databases.yaml
  - backup.yaml
  - roles.sops.yaml
  - backup.sops.yaml
components:
  - ../../../../../components/internal-ca
  - ../../../../../components/defaults
