# Point-in-time recovery: WAL is archived continuously and a base backup is taken every night, both compressed into
# Backblaze B2 and kept 14 days. Restore: docs operations/restore-postgres.md.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: b2
spec:
  retentionPolicy: 14d
  configuration:
    destinationPath: s3://cglc-bucket/pg
    endpointURL: "https://s3.eu-central-003.backblazeb2.com"
    s3Credentials:
      accessKeyId: { name: b2-pg, key: ACCESS_KEY_ID }
      secretAccessKey: { name: b2-pg, key: ACCESS_SECRET_KEY }
    wal: { compression: gzip, maxParallel: 2 }
    data: { compression: gzip }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: nightly
spec:
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  cluster: { name: pg }
  method: plugin
  pluginConfiguration: { name: barman-cloud.cloudnative-pg.io }
