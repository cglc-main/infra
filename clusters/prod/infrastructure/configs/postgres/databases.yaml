# One database per service, owned by its role (cluster.yaml).
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: kratos
spec:
  cluster: { name: pg }
  name: kratos
  owner: kratos
  ensure: present
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: hydra
spec:
  cluster: { name: pg }
  name: hydra
  owner: hydra
  ensure: present
