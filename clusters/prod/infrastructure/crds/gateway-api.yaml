# Gateway API, standard channel (Gateway, HTTPRoute, ...). Traefik implements it (controllers/traefik.yaml).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
spec:
  interval: 24h
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    tag: v1.7.0
  ignore: |
    /*
    !/config/crd/standard/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
spec:
  interval: 24h
  sourceRef: { kind: GitRepository, name: gateway-api }
  path: ./config/crd/standard
  prune: false
  wait: true
