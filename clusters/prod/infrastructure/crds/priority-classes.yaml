# Who keeps running when memory runs short (a node lost): tier-3 is evicted and preempted first, tier-1 last.
#   tier-1  what visitors and mail depend on: auth, the site, Postgres, Stalwart, Headscale (set explicitly)
#   tier-2  everything without a class: Nextcloud and the platform's controllers (the default)
#   tier-3  monitoring and logs (set explicitly); its per-node agents use system-node-critical, they cannot move
# Kubernetes' own system-cluster-critical / system-node-critical stay above all three.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: { name: tier-1 }
value: 300000
description: Keeps running when a node is lost.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: { name: tier-2 }
value: 200000
globalDefault: true
description: The default. Runs while there is room.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: { name: tier-3 }
value: 100000
description: First to go when memory runs short (monitoring, logs).
