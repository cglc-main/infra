# Headscale configuration. Keys: https://github.com/juanfont/headscale/blob/main/config-example.yaml
server_url: https://hs.bulbashenko.com
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 127.0.0.1:50443
noise:
  # From the Secret headscale: the same key wherever the pod runs, so clients keep trusting the server.
  private_key_path: /etc/headscale/secret/noise_private.key
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  # The three nodes register first and get 100.64.0.1-3: *.int.bulbashenko.com points there (tofu/dns.tf).
  allocation: sequential
derp:
  # Tailscale's public relays: used only when two devices cannot connect directly. Traffic stays end-to-end
  # encrypted by WireGuard.
  server: { enabled: false }
  urls: [https://controlplane.tailscale.com/derpmap/default]
  auto_update_enabled: true
  update_frequency: 3h
disable_check_updates: true
node:
  expiry: 0
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
log:
  level: info
  format: json
policy:
  mode: database
dns:
  magic_dns: true
  base_domain: mesh.bulbashenko.com
  override_local_dns: false
  nameservers:
    global: [1.1.1.1, 9.9.9.9]
unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"
oidc:
  # Start even while the SSO is down (the mesh keeps working without the control server anyway).
  only_start_if_oidc_is_available: false
  issuer: https://auth.bulbashenko.com
  client_id: headscale
  client_secret_path: /etc/headscale/secret/oidc_client_secret
  scope: [openid, profile, email, groups]
  allowed_groups: [vpn-users]
  pkce: { enabled: true, method: S256 }
logtail: { enabled: false }
