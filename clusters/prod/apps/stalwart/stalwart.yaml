# One replica (a cluster of Stalwart needs a coordinator and Redis; not worth it here). When its node is lost the pod
# starts on another one in about a minute; senders retry meanwhile. TLS for mail (STARTTLS on 25/587, implicit on
# 465/993) ends in Stalwart: its certificate comes from its own ACME client (DNS-01 at Cloudflare, plan.ndjson).
# Postgres: TLS without checking the internal CA (Stalwart only trusts public roots).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: stalwart }
  template:
    metadata:
      labels: { app: stalwart }
    spec:
      priorityClassName: tier-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: stalwart
          image: docker.io/stalwartlabs/stalwart:v1.2.0
          args: [--config, /etc/stalwart/config.json]
          envFrom: [{ secretRef: { name: stalwart } }]
          ports:
            - { name: smtp, containerPort: 2525 }
            - { name: submission, containerPort: 2587 }
            - { name: submissions, containerPort: 2465 }
            - { name: imaps, containerPort: 2993 }
            - { name: http, containerPort: 8080 }
          startupProbe:
            httpGet: { path: /healthz/live, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz/live, port: http }
            periodSeconds: 20
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /healthz/ready, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            # The image's binary carries the file capability cap_net_bind_service; without it in the bounding set
            # the kernel refuses to exec it ("operation not permitted"). Stalwart listens on ports above 1024 anyway.
            capabilities: { drop: [ALL], add: [NET_BIND_SERVICE] }
          volumeMounts:
            - { name: config, mountPath: /etc/stalwart/config.json, subPath: config.json, readOnly: true }
            - { name: blobs, mountPath: /var/lib/stalwart/blobs }
      volumes:
        - { name: config, configMap: { name: stalwart } }
        - { name: blobs, persistentVolumeClaim: { claimName: stalwart } }
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart
spec:
  selector: { app: stalwart }
  ports:
    - { name: smtp, port: 25, targetPort: smtp }
    - { name: submission, port: 587, targetPort: submission }
    - { name: submissions, port: 465, targetPort: submissions }
    - { name: imaps, port: 993, targetPort: imaps }
    - { name: http, port: 8080, targetPort: http }
