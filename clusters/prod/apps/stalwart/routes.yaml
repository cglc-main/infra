# Mail ports: Traefik passes the TCP stream through (Stalwart does TLS) and prepends a PROXY protocol v2 header, so
# Stalwart sees the client's address (SPF, rate limits). Traefik's entry points: controllers/traefik.yaml.
apiVersion: traefik.io/v1alpha1
kind: ServersTransportTCP
metadata:
  name: proxy-protocol
spec:
  proxyProtocol: { version: 2 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: smtp
spec:
  entryPoints: [smtp]
  routes:
    - match: HostSNI(`*`)
      services: [{ name: stalwart, port: 25, serversTransport: proxy-protocol }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: submission
spec:
  entryPoints: [submission]
  routes:
    - match: HostSNI(`*`)
      services: [{ name: stalwart, port: 587, serversTransport: proxy-protocol }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: submissions
spec:
  entryPoints: [submissions]
  routes:
    - match: HostSNI(`*`)
      services: [{ name: stalwart, port: 465, serversTransport: proxy-protocol }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: imaps
spec:
  entryPoints: [imaps]
  routes:
    - match: HostSNI(`*`)
      services: [{ name: stalwart, port: 993, serversTransport: proxy-protocol }]
---
# Web: the account page (mail.), JMAP/DAV, and the discovery names that Stalwart answers itself. The admin UI is not
# public: /admin redirects to mail.int, which resolves only in the mesh.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart
spec:
  parentRefs: [{ name: main, namespace: traefik, sectionName: subdomains }]
  hostnames:
    - mail.bulbashenko.com
    - autoconfig.bulbashenko.com
    - autodiscover.bulbashenko.com
    - mta-sts.bulbashenko.com
  rules:
    - matches: [{ path: { type: PathPrefix, value: /admin } }]
      filters:
        - type: RequestRedirect
          requestRedirect: { hostname: mail.int.bulbashenko.com, statusCode: 302 }
    - backendRefs: [{ name: stalwart, port: 8080 }]
---
# The admin UI (/admin), from the mesh only. Stalwart has its own sign-in (the SSO), so no forward-auth.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart-admin
spec:
  parentRefs: [{ name: main, namespace: traefik, sectionName: int }]
  hostnames: [mail.int.bulbashenko.com]
  rules:
    # Stalwart sends / to /account, and the web UI there would sign in with mail.int/account/oauth/callback, which
    # the SSO client does not list. mail.int is the admin UI; the account page is on the public name.
    - matches: [{ path: { type: Exact, value: / } }]
      filters:
        - type: RequestRedirect
          requestRedirect: { path: { type: ReplaceFullPath, replaceFullPath: /admin/ }, statusCode: 302 }
    - matches: [{ path: { type: PathPrefix, value: /account } }]
      filters:
        - type: RequestRedirect
          requestRedirect: { hostname: mail.bulbashenko.com, statusCode: 302 }
    - filters:
        - { type: ExtensionRef, extensionRef: { group: traefik.io, kind: Middleware, name: mesh-only } }
        - { type: ExtensionRef, extensionRef: { group: traefik.io, kind: Middleware, name: headers } }
      backendRefs: [{ name: stalwart, port: 8080 }]
