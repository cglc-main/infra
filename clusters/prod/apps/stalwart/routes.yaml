# Mail ports: Traefik passes the TCP stream through (Stalwart does TLS) and prepends a PROXY protocol v2 header, so
# Stalwart sees the client's address (SPF, rate limits). Traefik's entry points: controllers/traefik.yaml.
apiVersion: traefik.io/v1alpha1
kind: ServersTransportTCP
metadata:
  name: proxy-protocol
spec:
  proxyProtocol: { version: 2 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: smtp
spec:
  entryPoints: [smtp]
  routes:
    - match: HostSNI(`*`)
      services: [{ name: stalwart, port: 25, serversTransport: proxy-protocol }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: submission
spec:
  entryPoints: [submission]
  routes:
    - match: HostSNI(`*`)
      services: [{ name: stalwart, port: 587, serversTransport: proxy-protocol }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: submissions
spec:
  entryPoints: [submissions]
  routes:
    - match: HostSNI(`*`)
      services: [{ name: stalwart, port: 465, serversTransport: proxy-protocol }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: imaps
spec:
  entryPoints: [imaps]
  routes:
    - match: HostSNI(`*`)
      services: [{ name: stalwart, port: 993, serversTransport: proxy-protocol }]
---
# Web: the account page and admin (mail.), JMAP/DAV, and the discovery names that Stalwart answers itself.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart
spec:
  parentRefs: [{ name: main, namespace: traefik, sectionName: subdomains }]
  hostnames:
    - mail.bulbashenko.com
    - autoconfig.bulbashenko.com
    - autodiscover.bulbashenko.com
    - mta-sts.bulbashenko.com
  rules:
    - backendRefs: [{ name: stalwart, port: 8080 }]
