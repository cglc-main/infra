# Nextcloud from the official chart and image. Majors must be upgraded one at a time (Renovate: majors wait for a
# person). No upgrade rollback: an older image refuses a database the newer one has migrated; fix forward.
#   occ: kubectl -n nextcloud exec deploy/nextcloud -c nextcloud -- su -s /bin/sh www-data -c 'php occ <command>'
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  interval: 1h
  timeout: 20m
  targetNamespace: nextcloud
  releaseName: nextcloud
  chart:
    spec:
      chart: nextcloud
      version: 9.4.5
      sourceRef: { kind: HelmRepository, name: nextcloud }
  install: { remediation: { retries: 2 } }
  upgrade: { remediation: { retries: 0 } }
  # The chart keeps the data directory in its main volume; it must be on the Storage Box instead, and config.php's
  # copy (/srv/state) next to it. One volume, two subdirectories (namespace/storage.yaml).
  postRenderers:
    - kustomize:
        patches:
          - target: { kind: Deployment, name: nextcloud }
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: nextcloud }
              spec:
                template:
                  spec:
                    containers:
                      - name: nextcloud
                        volumeMounts:
                          - { name: storage-box, mountPath: /var/www/html/data, subPath: data }
                          - { name: storage-box, mountPath: /srv/state, subPath: state }
                      - name: nextcloud-cron
                        volumeMounts:
                          - { name: storage-box, mountPath: /var/www/html/data, subPath: data }
                          - { name: storage-box, mountPath: /srv/state, subPath: state }
                    volumes:
                      - name: storage-box
                        persistentVolumeClaim: { claimName: nextcloud }
  values:
    image:
      # renovate: datasource=docker depName=nextcloud
      tag: 35.0.3-apache
    priorityClassName: tier-2
    persistence: { enabled: false }
    nextcloud:
      host: cloud.bulbashenko.com
      trustedDomains: [cloud.bulbashenko.com, nextcloud.nextcloud.svc.cluster.local]
      # Inline: Flux's valuesFrom targetPath parses a value like --set and would split the script at its commas.
      hooks:
        before-starting: |
          #!/bin/sh
          # Runs as www-data before Apache starts, on every start (the image's hook before-starting). Makes this Nextcloud
          # match the repo, then saves config.php to the Storage Box. Every step is idempotent.
          set -eu
          occ() { php /var/www/html/occ "$@"; }

          # A newer image: migrate the database (a no-op otherwise). The code is already the image's (`prepare`).
          occ upgrade --no-interaction
          occ maintenance:update:htaccess >/dev/null
          occ db:add-missing-indices >/dev/null

          # Apps: custom_apps is empty on every start, so install from the app store what the instance uses.
          for app in user_oidc groupfolders; do
            occ app:getpath "$app" >/dev/null 2>&1 || occ app:install --keep-disabled "$app"
            occ app:enable "$app" >/dev/null
          done

          # Sign-in through the SSO (cglc-main/auth, client `nextcloud`; the provider's name `auth` is part of the back-channel
          # logout URL registered there). The login page goes straight to it; the local admin uses /login?direct=1.
          occ user_oidc:provider auth \
            --clientid=nextcloud --clientsecret-env=OIDC_CLIENT_SECRET \
            --discoveryuri=https://auth.bulbashenko.com/.well-known/openid-configuration \
            --scope="openid offline_access profile email groups" \
            --unique-uid=0 --mapping-uid=preferred_username --mapping-display-name=name --mapping-email=email \
            --mapping-groups=groups --group-provisioning=1 --group-whitelist-regex='/^(cloud-users|site-admins)$/' \
            --send-id-token-hint=1 >/dev/null
          occ config:app:set --type=string --value=0 user_oidc allow_multiple_user_backends >/dev/null

          # The local admin (break-glass, /login?direct=1) as in the Secret nextcloud. Its name starts with "_", which no
          # SSO username can (Kratos identity schema), so user_oidc never maps a person onto it.
          export OC_PASS="$NEXTCLOUD_ADMIN_PASSWORD"
          if occ user:info "$NEXTCLOUD_ADMIN_USER" >/dev/null 2>&1; then
            occ user:resetpassword --password-from-env "$NEXTCLOUD_ADMIN_USER" >/dev/null
          else
            occ user:add --password-from-env --display-name "Local admin" --group admin "$NEXTCLOUD_ADMIN_USER" >/dev/null
          fi
          unset OC_PASS

          # The site's media (docs contracts/site.md): Team folder Site with Gallery/ and Files/. The SSO group site-admins
          # writes; the local user `site` (the app) only reads.
          occ group:info site-admins >/dev/null 2>&1 || occ group:add site-admins >/dev/null
          occ group:info site-reader >/dev/null 2>&1 || occ group:add site-reader >/dev/null
          export OC_PASS="$SITE_PASSWORD"
          if occ user:info site >/dev/null 2>&1; then
            occ user:resetpassword --password-from-env site >/dev/null
          else
            occ user:add --password-from-env --display-name bulbashenko.com --group site-reader site >/dev/null
          fi
          unset OC_PASS
          id=$(occ groupfolders:list --output=json | php -r '
            foreach (json_decode(stream_get_contents(STDIN), true) as $f) if ($f["mountPoint"] === "Site") { echo $f["id"]; break; }')
          [ -n "$id" ] || id=$(occ groupfolders:create Site)
          occ groupfolders:group "$id" site-admins read write share delete >/dev/null
          occ groupfolders:group "$id" site-reader read >/dev/null
          for dir in Gallery Files; do mkdir -p "/var/www/html/data/__groupfolders/$id/$dir"; done
          occ groupfolders:scan "$id" >/dev/null

          # config.php to the Storage Box (written beside it, then renamed: a failed copy never replaces the last good one).
          cp /var/www/html/config/config.php /srv/state/.config.php.new
          mv /srv/state/.config.php.new /srv/state/config.php
          echo "start: done"
      existingSecret:
        enabled: true
        secretName: nextcloud
        usernameKey: admin-user
        passwordKey: admin-password
        smtpUsernameKey: smtp-username
        smtpPasswordKey: smtp-password
        smtpHostKey: smtp-host
      mail:
        enabled: true
        fromAddress: noreply
        domain: bulbashenko.com
        smtp: { secure: ssl, port: 465, authtype: LOGIN }
      configs:
        cluster.config.php: |-
          <?php
          $CONFIG = [
            'overwrite.cli.url' => 'https://cloud.bulbashenko.com',
            'overwriteprotocol' => 'https',
            // Traefik runs on the host network and reaches pods from the pod network.
            'trusted_proxies' => ['10.42.0.0/16'],
            // SMB reports the mode from the mount options, which Nextcloud cannot change.
            'check_data_directory_permissions' => false,
            'maintenance_window_start' => 1,
            'default_phone_region' => 'SK',
            // People come from the SSO; they do not manage names or passwords here.
            'allow_user_to_change_display_name' => false,
            'lost_password_link' => 'disabled',
            // Versions are in Git: no update checks or web updater.
            'updatechecker' => false,
            'upgrade.disable-web' => true,
            'skeletondirectory' => '',
            // Logs to stderr (VictoriaLogs).
            'log_type' => 'errorlog',
            'loglevel' => 2,
          ];
      extraEnv:
        # libpq verifies Postgres's certificate against the internal CA; no client certificate.
        - { name: PGSSLMODE, value: verify-full }
        - { name: PGSSLROOTCERT, value: /etc/internal-ca/ca.crt }
        - { name: PGSSLCERTMODE, value: disable }
        - { name: PHP_MEMORY_LIMIT, value: 512M }
        - { name: PHP_UPLOAD_LIMIT, value: 1G }
        - name: OIDC_CLIENT_SECRET
          valueFrom: { secretKeyRef: { name: nextcloud, key: oidc-client-secret } }
        - name: SITE_PASSWORD
          valueFrom: { secretKeyRef: { name: nextcloud, key: site-password } }
      extraVolumes:
        - name: internal-ca
          configMap: { name: internal-ca }
      extraVolumeMounts:
        - { name: internal-ca, mountPath: /etc/internal-ca, readOnly: true }
      # Lays out an empty code volume: the image's code, and config.php from the Storage Box. Without a saved
      # config.php the entrypoint installs a new instance, unless the files already hold one: then it stops rather
      # than install a second instance over them.
      extraInitContainers:
        - name: prepare
          image: docker.io/library/nextcloud:35.0.3-apache
          command:
            - sh
            - -c
            - |
              set -eu
              html=/var/www/html
              if [ ! -f /srv/state/config.php ]; then
                if ls -d /var/www/html/data/appdata_* >/dev/null 2>&1; then
                  echo "prepare: the files hold an instance but /srv/state has no config.php; not installing over it" >&2
                  exit 1
                fi
                echo "prepare: no config.php saved, the entrypoint installs a new instance"
                exit 0
              fi
              echo "prepare: the image's code, config.php from the Storage Box"
              rsync -rlD --chown www-data:root --delete --exclude-from=/upgrade.exclude /usr/src/nextcloud/ "$html/"
              for dir in config custom_apps themes; do
                rsync -rlD --chown www-data:root --ignore-existing "/usr/src/nextcloud/$dir/" "$html/$dir/"
              done
              install -o www-data -g www-data -m 0640 /srv/state/config.php "$html/config/config.php"
              # Last, as the entrypoint does: its presence tells the entrypoint the code is in place.
              install -o www-data -g root -m 0644 /usr/src/nextcloud/version.php "$html/version.php"
          volumeMounts:
            - { name: nextcloud-main, mountPath: /var/www/html, subPath: html }
            - { name: nextcloud-main, mountPath: /var/www/html/config, subPath: config }
            - { name: nextcloud-main, mountPath: /var/www/html/custom_apps, subPath: custom_apps }
            - { name: nextcloud-main, mountPath: /var/www/html/themes, subPath: themes }
            - { name: storage-box, mountPath: /var/www/html/data, subPath: data, readOnly: true }
            - { name: storage-box, mountPath: /srv/state, subPath: state, readOnly: true }
    internalDatabase: { enabled: false }
    externalDatabase:
      enabled: true
      type: postgresql
      host: pg-rw.data.svc.cluster.local
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud
        usernameKey: db-username
        passwordKey: db-password
    externalRedis:
      enabled: true
      host: valkey
      port: "6379"
      existingSecret:
        enabled: true
        secretName: nextcloud
        passwordKey: redis-password
    cronjob:
      enabled: true
      type: sidecar
    startupProbe:
      enabled: true
      failureThreshold: 60
    # Lenient: a Postgres switchover or a Valkey restart must not get Nextcloud restarted.
    livenessProbe:
      enabled: true
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 6
    httpRoute:
      enabled: true
      parentRefs: [{ name: main, namespace: traefik, sectionName: subdomains }]
      hostnames: [cloud.bulbashenko.com]
