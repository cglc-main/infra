apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
resources:
  - nextcloud.yaml
# The start hook as a file; Flux puts it into the chart's values (valuesFrom), and the generated name (with the
# content's hash) makes a changed script roll out a new release.
configMapGenerator:
  - name: nextcloud-start
    files: [start.sh]
configurations: [kustomizeconfig.yaml]
